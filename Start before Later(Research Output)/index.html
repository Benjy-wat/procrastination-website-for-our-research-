<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THSCDC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="intro-screen" id="introScreen">
        <div class="intro-content">
            <p class="intro-tag">A new beginning</p>
            <h1 class="intro-logo">THSCDC</h1>
            <p class="intro-subtitle">Focus. Discipline. Momentum.</p>
            <label class="username-field" for="usernameInput">
                <span>Username</span>
                <input id="usernameInput" type="text" placeholder="Enter your username" maxlength="20">
            </label>
            <button id="enterBtn" class="enter-btn">Enter Home</button>
        </div>
    </div>

    <header class="site-header">
        <nav class="navbar">
            <div class="brand">THSCDC</div>
        </nav>
    </header>

    <main class="hero home-page" id="home">
        <div class="hero-copy">
            <div class="brand-block">
                <span class="brand-logo">Welcome
                </span>
            </div>
            <p id="timeGreeting" class="eyebrow">Good morning</p>
            <p class="welcome-text">Welcome, <span id="usernameDisplay">Student</span>!</p>
        </div>
    </main>

    <section class="info-section" id="features">
        <div class="info-card">
            <h3>Built for Focus</h3>
            <p>Simple routines, fewer distractions, and better productivity habits.</p>
        </div>
        <div class="info-card" id="about">
            <h3>Purpose</h3>
            <p>Helping students turn intention into action before procrastination takes over.</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
